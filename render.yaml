services:
  - type: web
    name: ek-awaaz
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: ALLOW_REAL_ACTIONS
        value: "true"
      - key: LIVE_DISPATCH_ENABLED
        value: "false"
      - key: SMS_PROVIDER
        value: mock
      - key: DATABASE_PATH
        value: /app/data/ek_awaaz.db
